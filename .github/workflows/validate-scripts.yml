name: Validate scripts and import compatibility
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - if: github.event_name == 'push'
        run: node tools/sync-library-aliases.cjs
      - run: node tools/sync-library-aliases.cjs --check
      - run: node tools/verify-scripts.cjs
      - run: node --test tests/adapters.test.cjs
      - run: node sexbjcam-network-recovery.test.js
      - run: node stripchat-angellive/test.js
      - run: node --test stripchat-angellive/worker/test.js
      - run: python3 tools/verify-release.py
      - run: git diff --check
  sync-compatibility-paths:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: node tools/sync-library-aliases.cjs
      - run: node tools/commit-library-aliases.cjs
